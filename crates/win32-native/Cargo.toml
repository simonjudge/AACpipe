[package]
name = "aacpipe-win32-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["async", "napi8", "tokio_rt"] }
napi-derive = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
zeroize = "1"

[build-dependencies]
napi-build = "2"
