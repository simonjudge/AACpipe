name: Windows preview package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - 'scripts/**'
      - 'build/**'
      - '*lock*'
      - 'package.json'
      - '.github/workflows/preview.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: aacpipe-windows-preview
          if-no-files-found: error
          path: |
            release/AACpipe Setup *.exe
            release/SHA256SUMS.txt
            LICENSE
            dist/THIRD-PARTY-NOTICES.txt
            docs/releases/0.1.0-preview.1.md
